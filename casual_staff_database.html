function render(){
 const q=document.getElementById('search').value.toLowerCase().trim();
 let total=0, out='';
 for(const [sheet,rows] of Object.entries(DATA)){
   let matches=rows.filter(r=>!q || r.join(' ').toLowerCase().includes(q));
   if(!matches.length) continue;
   total+=matches.length;
   out += `<div class="card"><h2>${esc(sheet)}</h2><table>`;
   for(const r of matches.slice(0,300)){
      out += '<tr>'+r.map((v,i)=>i===0?`<td>${esc(v)}</td>`:`<td>${esc(v)}</td>`).join('')+'</tr>';
   }
   out += '</table>';
   if(matches.length>300) out += `<p class="small">Showing first 300 matches. Refine your search.</p>`;
   out += '</div>';
 }
 document.getElementById('count').textContent=total+' matching rows';
 document.getElementById('results').innerHTML=out || '<div class="card">No matching records found.</div>';
}
